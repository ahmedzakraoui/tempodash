    <script>
      function setTodayArabicDate(spanId) {
        const el = document.getElementById(spanId);
        if (!el) return;

        el.textContent = new Intl.DateTimeFormat("ar-TN", {
          day: "numeric",
          month: "long",
          year: "numeric",
        }).format(new Date());
      }

      // call it
      setTodayArabicDate("todayDate");

      const sections = document.querySelectorAll(".page-section");

      function showSectionFromHash() {
        const hash = window.location.hash.replace("#", "") || "info";

        sections.forEach((section) => {
          section.style.display = "none";
        });

        const activeSection = document.getElementById(hash);
        if (activeSection) {
          activeSection.style.display = "block";
        }
      }

      // عند تحميل الصفحة
      window.addEventListener("load", showSectionFromHash);

      // عند الضغط على menu
      window.addEventListener("hashchange", showSectionFromHash);

      document.addEventListener("DOMContentLoaded", () => {
        const hash = window.location.hash;
        if (hash) {
          document.querySelectorAll(".nav-link").forEach((link) => {
            if (link.getAttribute("href") === hash) {
              link.classList.add("active");
            } else {
              link.classList.remove("active");
            }
          });
        }
      });
    </script>

    <!--script_company_history-->
    <script>
      document.querySelectorAll(".popup_history tbody tr").forEach((row) => {
        const situation = row.dataset.situation;
        const revision = row.querySelector(".revision");
        const jointure = row.querySelector(".jointure");

        // التفعيل حسب الوضعية
        if (["E", "C"].includes(situation)) {
          jointure.disabled = false;
          revision.disabled = true;
        }

        if (situation === "S") {
          revision.disabled = false;
          jointure.disabled = true;
        }

        // ====== المنع العام (GLOBAL) ======
        revision.addEventListener("change", () => {
          if (revision.checked) {
            document.querySelectorAll(".jointure").forEach((j) => (j.checked = false));
          }
        });

        jointure.addEventListener("change", () => {
          if (jointure.checked) {
            document.querySelectorAll(".revision").forEach((r) => (r.checked = false));
          }
        });

        // رسائل التنبيه
        revision.addEventListener("click", (e) => {
          if (revision.disabled) {
            e.preventDefault();
            alert("لا تتم المراجعة إلا لبحث مستوفى");
          }
        });

        jointure.addEventListener("click", (e) => {
          if (jointure.disabled) {
            e.preventDefault();
            alert("لا يتم الضم إلا لبحث جاري");
          }
        });
      });
    </script>

    <!--ref_rev_or_joint_letter_switcher-->
    <script>
      document.getElementById("btnValider").addEventListener("click", () => {
        const refSpan = document.querySelector(".ref_enquete");
        const suffixSpan = document.querySelector(".ref_suffix");

        let suffix = "";

        document.querySelectorAll(".popup_history tbody tr").forEach((row) => {
          const revision = row.querySelector(".revision");
          const jointure = row.querySelector(".jointure");

          if (revision && revision.checked) {
            suffix = "R";
          }

          if (jointure && jointure.checked) {
            suffix = "J";
          }
        });

        if (!suffix) {
          suffixSpan.innerHTML = ""; // ✅ مسح R أو J
          return;
        }

        // تحديث الحرف فقط
        suffixSpan.innerHTML = `<span class="text-danger fw-bold">${suffix}</span>`;
      });
    </script>
    <!--Historique_consultation_enforcement-->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const btnShowList = document.getElementById("btnShowList");
        const btnSubmitSearch = document.getElementById("btnSubmitSearch");
        const listError = document.getElementById("listError");
        const cnssSwitch = document.getElementById("cnssSwitch");

        let hasSeenList = false;

        // Quand on clique sur "قائمة البحوث المسجلة"
        btnShowList.addEventListener("click", function () {
          hasSeenList = true;
          listError.style.display = "none"; // Cache le message si l'utilisateur consulte enfin
        });

        // Quand on clique sur "تسجيل البحث"
        btnSubmitSearch.addEventListener("click", function (event) {
          // On ne vérifie que si le switch n'est PAS coché (donc le bloc CNSS est actif)
          if (!cnssSwitch.checked && !hasSeenList) {
            event.preventDefault(); // Arrête la soumission du formulaire

            // Affiche le message
            listError.style.display = "block";

            // Fait défiler la page jusqu'au message d'erreur
            listError.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        });
      });
    </script>
